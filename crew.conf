# OpenThunder server pilot crew configuration.
#
# These skills are shipped to every client that connects, so this file sets the
# pilot model for the whole server. Lower `g_tolerance` for a harsher, more
# realistic server; raise it for a forgiving one.
#
# Recognised keys (unknown keys are ignored):
#   g_tolerance           positive g held before the pilot blacks out
#   negative_g_tolerance  negative g before the pilot reds out
#   blackout_rate         blackout gained per g above tolerance, per second
#   recovery_rate         vision recovered per second once the g comes off
#   stamina_drain         stamina lost per g above 3, per second
#   stamina_recovery      stamina recovered per second below 3 g
#
# War Thunder's maxed "G-tolerance" crew skill is about 6.9 g.

g_tolerance = 6.5
negative_g_tolerance = -3.0
blackout_rate = 0.18
recovery_rate = 0.4
stamina_drain = 0.012
stamina_recovery = 0.1

# Spotting (client-side markers). Aircraft are drawn within render_distance;
# enemies get a marker within detection_range inside the view cone, or always
# within awareness_range.
render_distance = 9000
detection_range = 7000
awareness_range = 1500
view_cone_deg = 25
